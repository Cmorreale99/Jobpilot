[project]
name = "jobpilot"
version = "0.1.0"
description = "Single-user, AI-assisted job-search operating system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "mcp>=1.2",
    "anthropic>=0.40",
    "docxtpl>=0.16",
    "sqlalchemy>=2.0",
    "cryptography>=42.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "alembic>=1.13",
    "apscheduler>=3.11.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
# architecture/v2 holds verified, drop-in V2 assets (renderer, template inputs);
# they are integrated as-is and must never be reformatted. The integrated copy of the
# renderer is equally frozen (M11 scope guard: integrate, never rewrite).
extend-exclude = ["architecture", "app/render/render_master_cv.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
# Alembic env/version scripts are executed by Alembic, not imported as typed modules.
exclude = ['app/db/migrations/']

# APScheduler 3.x ships no type stubs.
[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

# docxtpl ships no type stubs (used only by the frozen V2 renderer module).
[[tool.mypy.overrides]]
module = "docxtpl.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
